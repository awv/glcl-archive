name: Update Social Share Cards

on:
  push:
    branches:
      - main
    paths:
      - 'data.js'
      - 'assets/js/corrections.js'
      - 'assets/data/athlete_photos.json'
      - 'assets/data/athlete_headers.json'
      - 'assets/data/athlete_featured_photos.json'
      - 'assets/images/athletes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow certifi

      - name: 1. Export disambiguated runners
        run: node backend_tools/export_disambiguated_runners.js

      - name: 2. Generate Strava share cards
        run: python3 backend_tools/generate_strava_cards.py

      - name: 3. Generate social share stubs
        run: python3 backend_tools/generate_share_stubs.py

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cards/ share/ assets/data/disambiguated_runners.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-regenerate Strava cards & share stubs [skip ci]"
            git push
          else
            echo "No card or stub changes detected."
          fi

<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLCL Archive — Fixture Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data.js"></script>
    <script src="site-layout.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#0066cc' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030712; }
        .cat-card { background-color: #090d16; }
    </style>
</head>
<body class="text-slate-300 font-sans antialiased">

    <!-- GLOBAL NAVIGATION CONTAINER -->
    <nav id="global-nav" class="border-b border-slate-900 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <!-- Injected automatically -->
    </nav>

    <script>
        fetch('components/nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('global-nav').innerHTML = data;
                window.dispatchEvent(new Event('navLoaded'));
            })
            .catch(err => console.error('Error loading navigation header:', err));
    </script>

    <!-- HEADER -->
   <header class="max-w-[1400px] w-full mx-auto px-4 pt-10 pb-6 border-b border-slate-900 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
        <div>
            <span id="fixture-meta" class="text-[10px] font-mono font-bold text-brand-500 uppercase tracking-widest block">Fixture Overview</span>
            <h1 id="fixture-title" class="text-3xl font-black text-slate-100 tracking-tight uppercase mt-0.5">Loading Results...</h1>
            <p id="fixture-sub" class="text-xs font-medium text-slate-500 mt-1 uppercase tracking-wider">Calculating database field index...</p>
            <div id="fixture-photo-header-btn" class="mt-3"></div>
        </div>
        <div class="flex gap-4 font-mono text-center">
            <div class="bg-slate-950 border border-slate-900 p-3 rounded-xl min-w-[90px]">
                <span class="block text-[9px] font-bold text-slate-500 uppercase">Field Size</span>
                <span id="count-total" class="text-lg font-black text-slate-200">0</span>
            </div>
            <div class="bg-slate-950 border border-slate-900 p-3 rounded-xl min-w-[90px]">
                <span class="block text-[9px] font-bold text-slate-500 uppercase">Men</span>
                <span id="count-men" class="text-lg font-black text-sky-400">0</span>
            </div>
            <div class="bg-slate-950 border border-slate-900 p-3 rounded-xl min-w-[90px]">
                <span class="block text-[9px] font-bold text-slate-500 uppercase">Women</span>
                <span id="count-women" class="text-lg font-black text-pink-400">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] w-full mx-auto px-4 py-12 space-y-12 flex-grow">

        <!-- CATEGORY WINNERS GRID SECTION -->
        <section id="category-winners-section" class="space-y-4">
            <h2 class="text-xs font-black tracking-widest text-slate-500 uppercase">Age Category Winners</h2>
            <div id="category-winners-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <!-- Dynamically populated with category cards -->
            </div>
        </section>

        <!-- HISTORICAL FIXTURE NOTES CONTAINER -->
        <section id="fixture-notes-container" class="hidden">
            <div class="border border-brand-500/20 bg-brand-500/5 rounded-xl p-4 flex gap-3 items-start">
                <span class="text-brand-500 font-mono font-bold text-sm select-none">ℹ️</span>
                <div class="space-y-1">
                    <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">Historical Note</h3>
                    <p id="fixture-notes-text" class="text-xs text-slate-400 leading-relaxed"></p>
                </div>
            </div>
        </section>
        
        <!-- RESULTS MAIN CONTAINER -->
        <section id="results-sections-container" class="space-y-10">
            <!-- Dynamically populated standings -->
        </section>
    </main>

    <!-- RUNTIME SCRIPTER -->
    <script>
        function capitalizeWord(str) {
            return str ? str.charAt(0).toUpperCase() + str.slice(1).toLowerCase() : '';
        }

        function formatRunnerName(rawName) {
            if (!rawName) return '';
            let name = rawName.trim();

            name = name
                .replace(/\b(MEN|MAN|LADIES|WOMEN|CLUB)\b/gi, '')
                .replace(/\bO\/?\d+\b/gi, '')
                .replace(/\bV\d+\b/gi, '')
                .replace(/\b69\b/g, '')
                .replace(/\b\d+\b/g, '')
                .replace(/\b[MF]\b/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            if (name.includes(',')) {
                const parts = name.split(',');
                const surname = parts[0].trim();
                const firstName = parts.slice(1).join(' ').trim();
                return `${capitalizeWord(firstName)} ${capitalizeWord(surname)}`;
            }

            const parts = name.split(/\s+/);
            if (parts.length >= 2 && parts[0] === parts[0].toUpperCase() && /[A-Z]{2,}/.test(parts[0])) {
                const surname = parts[0];
                const firstName = parts.slice(1).join(' ');
                return `${firstName.split(/\s+/).map(capitalizeWord).join(' ')} ${capitalizeWord(surname)}`;
            }

            return name.split(/\s+/).map(capitalizeWord).join(' ');
        }

        function formatSex(rawSex, rawName = '') {
            if (/katherine|gemma|sian|sandra|sue|jane|becky|gwen|emma|stella|mel|helen|kate|claire|lisa|nicola|sarah/i.test(rawName)) {
                return 'F';
            }
            if (!rawSex) return '';
            const sex = rawSex.trim().toUpperCase();
            if (sex === 'MEN' || sex === 'MALE' || sex === 'M') return 'M';
            if (sex === 'LADIES' || sex === 'WOMEN' || sex === 'FEMALE' || sex === 'F') return 'F';
            return sex;
        }

        function formatAgeCat(rawCat) {
            if (!rawCat) return 'SENIOR';
            let cat = rawCat.trim().toUpperCase();

            if (/^O\/?\d+/.test(cat)) {
                cat = cat.replace(/^O\/?/, 'V');
            }

            if (cat === 'SEN' || cat === 'SENIOR' || cat === 'V18') {
                return 'SENIOR';
            }

            return cat;
        }

        function formatClubName(rawClub) {
            if (!rawClub) return 'Unattached';
            const club = rawClub.trim();

            if (/^\d+$/.test(club)) {
                return club === '69' ? 'Club 69' : 'Unattached';
            }
            if (/^(MEN|LADIES|WOMEN|M|F)$/i.test(club)) {
                return 'Unattached';
            }

            const lower = club.toLowerCase();

            if (lower.includes('abertillery')) return 'Abertillery AC';
            if (lower.includes('griffithstown')) return 'Griffithstown Harriers';
            if (lower.includes('chepstow')) return 'Chepstow Harriers';
            if (lower.includes('islwyn')) return 'Islwyn RC';
            if (lower.includes('lliswerry')) return 'Lliswerry Runners';
            if (lower.includes('caerleon')) return 'Caerleon RC';
            if (lower.includes('fairwater')) return 'Fairwater Runners';
            if (lower.includes('club 69') || lower.includes('club69') || club === '69') return 'Club 69';
            if (lower.includes('caldicot')) return 'Caldicot Running Club';
            if (lower.includes('parc bryn bach')) return 'Parc Bryn Bach RC';
            if (lower.includes('pont-y-pwl') || lower.includes('pontypool')) return 'Pont-y-Pwl & District Runners';
            if (lower.includes('monmouth')) return 'Spirit of Monmouth RC';
            if (lower.includes('san domenico')) return 'San Domenico';
            if (lower.includes('builth')) return 'Builth District RC';

            return club;
        }

        const knownClubKeywords = [
            'chepstow', 'islwyn', 'griffithstown', 'caerleon', 'caldicot', 'lliswerry', 
            'fairwater', 'club 69', 'club69', 'parc bryn bach', 'monmouth', 
            'pontypridd', 'san domenico', 'unattached', 'builth', 'brecon', 'pont-y-pwl', 'pontypool', 'abertillery'
        ];

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawSeason = urlParams.get('season') || '2025_2026';
            const discipline = urlParams.get('discipline') || 'xc';
            const raceNum = parseInt(urlParams.get('race'), 10) || 1;

            const selectedSeason = rawSeason.replace('_', '/');

            // Load photo albums mapping
            let fixtureAlbums = {};
            try {
                const albumRes = await fetch('assets/data/fixture_photo_albums.json');
                if (albumRes.ok) fixtureAlbums = await albumRes.json();
            } catch (e) {
                console.log("Fixture photo albums fallback", e);
            }

            const fixtureKey1 = `${selectedSeason}_${discipline.toLowerCase()}_${raceNum}`;
            const fixtureKey2 = `${rawSeason}_${discipline.toLowerCase()}_${raceNum}`;
            const fixtureAlbum = fixtureAlbums[fixtureKey1] || fixtureAlbums[fixtureKey2] || null;

            // Load lightweight photo tags strictly for this fixture album (only ~400KB, instant load)
            const fixturePhotoMap = new Map();
            if (fixtureAlbum && fixtureAlbum.album_id) {
                try {
                    const albumPhotosRes = await fetch(`assets/data/albums/${fixtureAlbum.album_id}.json`);
                    if (albumPhotosRes.ok) {
                        const albumPhotos = await albumPhotosRes.json();
                        Object.values(albumPhotos).forEach(p => {
                            const runners = (p.runners && p.runners.length > 0) ? p.runners : [{ bib: p.bib, name: p.name, club: p.club }];
                            runners.forEach(r => {
                                if (r.bib) {
                                    const b = String(r.bib).trim();
                                    if (!fixturePhotoMap.has(b)) fixturePhotoMap.set(b, []);
                                    fixturePhotoMap.get(b).push(p);
                                }
                                if (r.name) {
                                    const n = r.name.toLowerCase().trim();
                                    if (!fixturePhotoMap.has(n)) fixturePhotoMap.set(n, []);
                                    fixturePhotoMap.get(n).push(p);
                                }
                            });
                        });
                    }
                } catch (err) {
                    console.log("Fixture album photo tags fallback", err);
                }
            }
            
            window.addEventListener('navLoaded', () => {
                const navBack = document.getElementById('nav-back-link');
                if (navBack) {
                    navBack.removeAttribute('onclick'); 
                    navBack.href = `season.html?season=${rawSeason}&discipline=${discipline}`;
                    navBack.textContent = `← Back to Season Summary`;
                }
            });

            const allRecords = window.glclResults || [];

            // FILTER FIRST: Isolate records for this fixture before doing repairs (<1ms vs 3000ms!)
            const targetDiscipline = discipline.toLowerCase();
            const rawMatched = allRecords.filter(row => {
                const s = row.season;
                const d = (row.discipline || '').toLowerCase();
                const r = parseInt(row.race_number, 10);
                return (s === selectedSeason || s === rawSeason) && d === targetDiscipline && r === raceNum;
            });

            if (rawMatched.length === 0) {
                document.getElementById('fixture-title').textContent = "No Records Found";
                return;
            }

            // Quick lookup of runner->club across the dataset only for runners in this fixture who need club resolution
            const athletesNeedingClub = new Set(
                rawMatched
                    .filter(r => !r.club || r.club === 'Unattached' || r.club === '1')
                    .map(r => (r.name || '').toLowerCase())
                    .filter(Boolean)
            );
            const athleteClubMap = {};
            if (athletesNeedingClub.size > 0) {
                for (let i = 0; i < allRecords.length; i++) {
                    const row = allRecords[i];
                    if (row.name && row.club && row.club !== 'Unattached' && row.club !== '1') {
                        const n = row.name.toLowerCase();
                        if (athletesNeedingClub.has(n)) {
                            athleteClubMap[n] = formatClubName(row.club);
                        }
                    }
                }
            }

            // PASS 1: AUTO-REPAIR & CLEAN ONLY THE FIXTURE'S ~300 RECORDS
            const allMatched = rawMatched.map(row => {
                let updated = { ...row };
                let raw = updated.name || '';
                let rawBib = updated.bib ? String(updated.bib).trim() : '';
                let rawClub = updated.club ? String(updated.club).trim() : '';

                // Extract embedded club names stuck inside athlete names (e.g. "Mark Abertillery Morgan")
                const embeddedClubMatch = raw.match(/\b(Abertillery(\s+AC)?|Chepstow(\s+Harriers)?|Islwyn(\s+RC)?|Griffithstown(\s+Harriers)?|Caerleon(\s+RC)?|Lliswerry(\s+Runners)?|Fairwater(\s+Runners)?|Pont-y-Pwl|Pontypool|Parc Bryn Bach|Monmouth(\s+Harriers)?|San Domenico|Builth(\s+District\s+RC)?)\b/i);
                if (embeddedClubMatch) {
                    const extractedClub = embeddedClubMatch[0];
                    if (!updated.club || updated.club === 'Unattached' || updated.club === '1' || !knownClubKeywords.some(kw => String(updated.club).toLowerCase().includes(kw))) {
                        updated.club = formatClubName(extractedClub);
                    }
                    raw = raw.replace(embeddedClubMatch[0], '').replace(/\s+/g, ' ').trim();
                    updated.name = raw;
                }

                // Repair surnames in bib field
                if (rawBib && /^[a-zA-Z\s'-]+$/.test(rawBib) && !/^\d+$/.test(rawBib)) {
                    const cleanFirstName = formatRunnerName(raw);
                    const cleanSurname = capitalizeWord(rawBib);
                    updated.name = `${cleanFirstName} ${cleanSurname}`.trim();
                    updated.bib = '-';
                    raw = updated.name;
                } else if (!rawBib || rawBib === '0') {
                    updated.bib = '-';
                }

                // Repair surnames in club field
                if (rawClub && !knownClubKeywords.some(kw => rawClub.toLowerCase().includes(kw))) {
                    if (/^[a-zA-ZáéíóúÁÉÍÓÚñÑ'-]+$/.test(rawClub)) {
                        const cleanName = formatRunnerName(raw);
                        const cleanSurname = capitalizeWord(rawClub);
                        updated.name = `${cleanName} ${cleanSurname}`.trim();
                        updated.club = 'Unattached';
                        raw = updated.name;
                    }
                }

                // Extract Club 69
                if (/\b69\b/.test(raw) || updated.club === '1' || updated.club === '69' || /club69/i.test(raw)) {
                    updated.club = 'Club 69';
                }

                // Extract Age Category
                const catMatch = raw.match(/\b(O\/?\d+|V\d+|SENIOR|SEN)\b/i);
                if (catMatch) {
                    let extractedCat = catMatch[0].toUpperCase();
                    if (/^O\/?\d+/.test(extractedCat)) {
                        extractedCat = extractedCat.replace(/^O\/?/, 'V');
                    }
                    updated.age_cat = extractedCat;
                }

                // Extract Category Position
                const catPosMatch = raw.match(/\b(O\/?\d+|V\d+|SENIOR|SEN)\s+(\d+)\b/i);
                if (catPosMatch) {
                    updated.cat_pos = parseInt(catPosMatch[2], 10);
                }

                // Extract Gender
                if (/\b(LADIES|WOMEN)\b/i.test(raw)) {
                    updated.sex = 'F';
                } else if (/\b(MEN|MAN)\b/i.test(raw)) {
                    updated.sex = 'M';
                }

                updated.name = formatRunnerName(updated.name);
                updated.sex = formatSex(updated.sex, updated.name);
                if (updated.age_cat) updated.age_cat = formatAgeCat(updated.age_cat);
                if (updated.club) updated.club = formatClubName(updated.club);

                if ((!updated.club || updated.club === 'Unattached') && updated.name) {
                    const knownClub = athleteClubMap[updated.name.toLowerCase()];
                    if (knownClub) updated.club = knownClub;
                }

                return updated;
            });

            if (allMatched.length === 0) {
                document.getElementById('fixture-title').textContent = "No Records Found";
                return;
            }

            const meta = allMatched[0];
            document.getElementById('fixture-title').textContent = meta.venue;
            document.getElementById('fixture-meta').textContent = `Fixture ${raceNum} — GLCL ${discipline.toUpperCase()}`;
            document.getElementById('fixture-sub').textContent = `${meta.date} • Course Distance: ${meta.distance || 'N/A'}`;

            if (fixtureAlbum) {
                const photoCountStr = Number(fixtureAlbum.photos || 0).toLocaleString();
                const photosUrl = `photos.html?album=${fixtureAlbum.album_id}`;
                
                // Inject Header Photo Button (links to on-site race photography gallery)
                const headerPhotoContainer = document.getElementById('fixture-photo-header-btn');
                if (headerPhotoContainer) {
                    headerPhotoContainer.innerHTML = `
                        <a href="${photosUrl}" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-bold bg-brand-500/10 hover:bg-brand-500 text-brand-300 hover:text-white border border-brand-500/30 transition-all shadow-sm group" title="View all ${photoCountStr} race photos on the site">
                            <span>📸</span>
                            <span>View Race Photos</span>
                            <span class="bg-brand-500/20 group-hover:bg-brand-400/30 text-[10px] font-mono px-1.5 py-0.5 rounded text-brand-200">${photoCountStr}</span>
                            <span class="group-hover:translate-x-0.5 transition-transform">→</span>
                        </a>
                    `;
                }
            }

            const resultsContainer = document.getElementById('results-sections-container');
            const winnersSection = document.getElementById('category-winners-section');
            const notesContainer = document.getElementById('fixture-notes-container');
            const notesText = document.getElementById('fixture-notes-text');

            if (meta.notes && meta.notes.trim() !== '') {
                notesText.textContent = meta.notes;
                notesContainer.classList.remove('hidden');
            } else {
                notesContainer.classList.add('hidden');
            }

            if (meta.status === 'Results Missing') {
                if (winnersSection) winnersSection.style.display = 'none';
                resultsContainer.innerHTML = `
                    <div class="border border-amber-500/20 bg-amber-500/5 rounded-xl p-8 text-center space-y-2">
                        <h3 class="text-lg font-bold text-amber-400">Results Missing</h3>
                        <p class="text-xs text-slate-400 max-w-md mx-auto">
                            The results for this fixture are currently missing from the archive documentation.
                        </p>
                    </div>
                `;
                return;
            }

            if (meta.status === 'Cancelled') {
                if (winnersSection) winnersSection.style.display = 'none';
                resultsContainer.innerHTML = `
                    <div class="border border-red-500/20 bg-red-500/5 rounded-xl p-8 text-center space-y-2">
                        <h3 class="text-lg font-bold text-red-400">Fixture Cancelled</h3>
                        <p class="text-xs text-slate-400 max-w-md mx-auto">
                            This fixture was cancelled and no race took place.
                        </p>
                    </div>
                `;
                return;
            }

            const filtered = allMatched.filter(row => row.pos > 0).sort((a, b) => a.pos - b.pos);

            const menCount = filtered.filter(r => formatSex(r.sex, r.name) === 'M').length;
            const womenCount = filtered.filter(r => formatSex(r.sex, r.name) === 'F').length;
            document.getElementById('count-total').textContent = filtered.length;
            document.getElementById('count-men').textContent = menCount;
            document.getElementById('count-women').textContent = womenCount;

            // Compute Age Category Winners
            const targetedCategories = ['SENIOR', 'V35', 'V40', 'V45', 'V50', 'V55', 'V60', 'V65', 'V70', 'V75+'];
            const catWinnersMap = {};
            
            targetedCategories.forEach(cat => {
                catWinnersMap[cat] = { M: null, F: null };
            });

            filtered.forEach(row => {
                let normCat = formatAgeCat(row.age_cat);
                const sexKey = formatSex(row.sex, row.name);

                if (normCat.startsWith('V75') || normCat.startsWith('V80') || normCat.startsWith('V85')) {
                    normCat = 'V75+';
                }

                if (catWinnersMap[normCat] && sexKey) {
                    const catPosNum = parseInt(row.cat_pos, 10);
                    const currentWinner = catWinnersMap[normCat][sexKey];

                    if (catPosNum === 1) {
                        catWinnersMap[normCat][sexKey] = { name: row.name, club: formatClubName(row.club) };
                    } else if (!currentWinner) {
                        catWinnersMap[normCat][sexKey] = { name: row.name, club: formatClubName(row.club) };
                    }
                }
            });

            // Render Category Cards Grid
            const winnersGrid = document.getElementById('category-winners-grid');
            winnersGrid.innerHTML = '';

            targetedCategories.forEach(cat => {
                const maleWinnerObj = catWinnersMap[cat].M;
                const femaleWinnerObj = catWinnersMap[cat].F;

                const maleFormattedName = maleWinnerObj ? formatRunnerName(maleWinnerObj.name) : '';
                const femaleFormattedName = femaleWinnerObj ? formatRunnerName(femaleWinnerObj.name) : '';

                const maleWinnerHtml = maleWinnerObj 
                    ? `<a href="athlete.html?name=${encodeURIComponent(maleFormattedName)}&club=${encodeURIComponent(maleWinnerObj.club)}" class="hover:text-brand-500 transition-colors">${maleFormattedName}</a>` 
                    : '<span class="text-slate-600 font-normal">N/A</span>';

                const femaleWinnerHtml = femaleWinnerObj 
                    ? `<a href="athlete.html?name=${encodeURIComponent(femaleFormattedName)}&club=${encodeURIComponent(femaleWinnerObj.club)}" class="hover:text-brand-500 transition-colors">${femaleFormattedName}</a>` 
                    : '<span class="text-slate-600 font-normal">N/A</span>';

                const cardHtml = `
                    <div class="cat-card p-4 rounded-xl border border-slate-800 flex flex-col justify-between shadow-md">
                        <h4 class="text-xs font-black text-brand-500 uppercase tracking-widest border-b border-slate-800 pb-1.5 mb-2">
                            ${cat}
                        </h4>
                        <div class="space-y-1.5 text-[11px]">
                            <div class="flex justify-between items-center">
                                <span class="font-mono text-slate-500 font-bold uppercase">M</span>
                                <span class="font-bold text-slate-200 truncate max-w-[120px] text-right" title="${maleFormattedName || 'N/A'}">
                                    ${maleWinnerHtml}
                                </span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="font-mono text-slate-500 font-bold uppercase">F</span>
                                <span class="font-bold text-slate-200 truncate max-w-[120px] text-right" title="${femaleFormattedName || 'N/A'}">
                                    ${femaleWinnerHtml}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                winnersGrid.insertAdjacentHTML('beforeend', cardHtml);
            });

            // MULTI-SECTION TABLE RENDERING
            const sectionsMap = {};
            filtered.forEach(row => {
                const secName = row.race_section || "Main";
                if (!sectionsMap[secName]) {
                    sectionsMap[secName] = [];
                }
                sectionsMap[secName].push(row);
            });

            resultsContainer.innerHTML = '';

            const sectionNames = Object.keys(sectionsMap);

            sectionNames.forEach(secName => {
                const sectionRows = sectionsMap[secName];
                const sectionTitle = (sectionNames.length === 1 && secName === "Main") 
                    ? "Full Field Standings" 
                    : `${secName} Standings`;

                const buildRowsHtml = (rows) => {
                    return rows.map(row => {
                        const formattedName = formatRunnerName(row.name);
                        const normSex = formatSex(row.sex, row.name);
                        const normCat = formatAgeCat(row.age_cat);
                        const displayClub = formatClubName(row.club);
                        
                        const sexColor = normSex === 'M' ? 'text-sky-400' : 'text-pink-400';
                        const podiumRowBg = row.pos <= 3 ? 'bg-brand-500/5 font-semibold text-slate-100' : 'hover:bg-slate-900/10';
                        
                        const catPosNum = parseInt(row.cat_pos, 10);
                        let catPosHtml = `<span class="text-slate-400">Pos ${row.cat_pos}</span>`;
                        
                        if (catPosNum === 1) {
                            catPosHtml = `<span class="inline-block font-mono font-bold text-[10px] text-amber-400 bg-amber-400/10 border border-amber-500/20 px-1.5 py-0.5 rounded">🥇 Pos 1</span>`;
                        } else if (catPosNum === 2) {
                            catPosHtml = `<span class="inline-block font-mono font-bold text-[10px] text-slate-300 bg-slate-300/10 border border-slate-400/20 px-1.5 py-0.5 rounded">🥈 Pos 2</span>`;
                        } else if (catPosNum === 3) {
                            catPosHtml = `<span class="inline-block font-mono font-bold text-[10px] text-amber-600 bg-amber-600/10 border border-amber-700/20 px-1.5 py-0.5 rounded">🥉 Pos 3</span>`;
                        }

                        const athleteUrl = `athlete.html?name=${encodeURIComponent(formattedName)}&club=${encodeURIComponent(displayClub)}`;

                        const runnerBib = row.bib && row.bib !== '-' ? String(row.bib).trim() : '';
                        const runnerNameClean = formattedName.toLowerCase();
                        
                        // O(1) Instant Photo Lookup
                        const byBib = (runnerBib && fixturePhotoMap.get(runnerBib)) || [];
                        const byName = fixturePhotoMap.get(runnerNameClean) || [];
                        const candidatePhotos = [...byBib, ...byName];
                        const runnerPhotos = [];
                        const seenPids = new Set();
                        candidatePhotos.forEach(p => {
                            if (!seenPids.has(p.id)) {
                                seenPids.add(p.id);
                                runnerPhotos.push({
                                    id: p.id,
                                    bib: p.bib || runnerBib,
                                    name: p.name || formattedName,
                                    club: p.club || displayClub,
                                    runners: p.runners || [{ bib: p.bib || runnerBib, name: p.name || formattedName, club: p.club || displayClub }],
                                    sharpness: p.sharpness || 0,
                                    url_m: p.url_m || (p.server && p.secret ? `https://live.staticflickr.com/${p.server}/${p.id}_${p.secret}_m.jpg` : ''),
                                    url_large: p.url_large || (p.server && p.secret ? `https://live.staticflickr.com/${p.server}/${p.id}_${p.secret}_b.jpg` : (p.url_m || ''))
                                });
                            }
                        });
                        runnerPhotos.sort((a, b) => (b.sharpness || 0) - (a.sharpness || 0));

                        let photoIconHtml = '';
                        if (runnerPhotos.length > 0) {
                            const photosJsonStr = encodeURIComponent(JSON.stringify(runnerPhotos));
                            const albumId = fixtureAlbum ? fixtureAlbum.album_id : '';
                            photoIconHtml = `
                                <button type="button" 
                                        class="results-photo-badge inline-flex items-center gap-1 text-[10px] font-mono font-bold text-amber-300 bg-amber-400/10 hover:bg-amber-400 hover:text-slate-950 px-1.5 py-0.5 rounded transition border border-amber-400/30 ml-2 shadow-sm cursor-pointer"
                                        data-runner="${encodeURIComponent(formattedName)}"
                                        data-bib="${runnerBib}"
                                        data-club="${encodeURIComponent(displayClub)}"
                                        data-album="${albumId}"
                                        data-photos="${photosJsonStr}"
                                        title="View ${runnerPhotos.length} photo${runnerPhotos.length > 1 ? 's' : ''} for ${formattedName}">
                                    <span>📸</span>
                                    <span>${runnerPhotos.length}</span>
                                </button>
                            `;
                        }

                        return `
                            <tr class="transition-colors ${podiumRowBg}">
                                <td class="py-3 px-4 text-center font-mono font-bold text-slate-400">${row.pos}</td>
                                <td class="py-3 px-4 text-center font-mono text-slate-500">${row.bib || '-'}</td>
                                <td class="py-3 px-4 font-bold text-slate-200">
                                    <div class="flex items-center">
                                        <a href="${athleteUrl}" class="hover:text-brand-500 transition-colors">${formattedName}</a>
                                        ${photoIconHtml}
                                    </div>
                                </td>
                                <td class="py-3 px-4 text-center font-black ${sexColor}">${normSex}</td>
                                <td class="py-3 px-4 uppercase tracking-tight text-slate-400 font-medium">${normCat}</td>
                                <td class="py-3 px-4 font-medium"><a href="club.html?name=${encodeURIComponent(displayClub)}" class="hover:text-brand-500 transition-colors">${displayClub}</a></td>
                                <td class="py-2 px-4 text-center">${catPosHtml}</td>
                                <td class="py-3 px-4 text-center font-mono text-slate-400">Pos ${row.gender_pos}</td>
                                <td class="py-3 px-4 text-right font-mono font-bold pr-6 text-brand-500">${row.time}</td>
                            </tr>
                        `;
                    }).join('');
                };

                const sectionBlockHtml = `
                    <div class="space-y-4">
                        <h2 class="text-xs font-black tracking-widest text-slate-500 uppercase">${sectionTitle}</h2>
                        <div class="border border-slate-900 bg-slate-950 rounded-xl overflow-hidden shadow-2xl">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="border-b border-slate-900 font-black uppercase tracking-wider text-slate-500 bg-slate-900/40 text-[10px]">
                                             <th class="py-3 px-4 w-16 text-center">Pos</th>
                                             <th class="py-3 px-4 w-16 text-center">Bib</th>
                                             <th class="py-3 px-4">Athlete Name</th>
                                             <th class="py-3 px-4 w-16 text-center">Sex</th>
                                             <th class="py-3 px-4">Age Category</th>
                                             <th class="py-3 px-4">Club</th>
                                             <th class="py-3 px-4 text-center w-24">Cat Pos</th>
                                             <th class="py-3 px-4 text-center w-24">Gender Pos</th>
                                             <th class="py-3 px-4 text-right pr-6 w-24">Time</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-900/40 text-slate-300">
                                        ${buildRowsHtml(sectionRows)}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                resultsContainer.insertAdjacentHTML('beforeend', sectionBlockHtml);
            });

            // --- UNIFIED RUNNER PHOTO LIGHTBOX & FILMSTRIP VIEWER CONTROLLER ---
            let viewerActivePhotos = [];
            let viewerCurrentIndex = 0;
            let viewerRunnerBib = '';

            const viewerModal = document.getElementById('results-photo-viewer');
            const viewerCloseBtn = document.getElementById('viewer-close-btn');
            const viewerRunnerName = document.getElementById('viewer-runner-name');
            const viewerRunnerClub = document.getElementById('viewer-runner-club');
            const viewerBibBadge = document.getElementById('viewer-bib-badge');
            const viewerCounterBadge = document.getElementById('viewer-counter-badge');
            const viewerDownloadBtn = document.getElementById('viewer-download-btn');
            const viewerAlbumBtn = document.getElementById('viewer-album-btn');
            const viewerMobileAlbumLink = document.getElementById('viewer-mobile-album-link');
            const viewerMainImage = document.getElementById('viewer-main-image');
            const viewerImageSpinner = document.getElementById('viewer-image-spinner');
            const viewerImgBibOverlay = document.getElementById('viewer-img-bib-overlay');
            const viewerPrevBtn = document.getElementById('viewer-prev-btn');
            const viewerNextBtn = document.getElementById('viewer-next-btn');
            const viewerStage = document.getElementById('viewer-stage');
            const viewerFilmstripContainer = document.getElementById('viewer-filmstrip-container');
            const viewerFilmstrip = document.getElementById('viewer-filmstrip');

            const closeResultsViewer = () => {
                if (viewerModal) viewerModal.classList.add('hidden');
                document.body.style.overflow = '';
            };

            const updateResultsViewer = () => {
                if (!viewerActivePhotos || viewerActivePhotos.length === 0) return;
                const p = viewerActivePhotos[viewerCurrentIndex];
                if (!p) return;

                if (viewerImageSpinner) viewerImageSpinner.classList.remove('hidden');
                viewerMainImage.onload = () => {
                    if (viewerImageSpinner) viewerImageSpinner.classList.add('hidden');
                };
                viewerMainImage.onerror = () => {
                    if (viewerImageSpinner) viewerImageSpinner.classList.add('hidden');
                };

                const largeUrl = p.url_large || p.url_m;
                viewerMainImage.src = largeUrl;
                viewerCounterBadge.textContent = `${viewerCurrentIndex + 1} of ${viewerActivePhotos.length}`;
                
                const runnersList = (p.runners && Array.isArray(p.runners) && p.runners.length > 0) ? p.runners : (p.bib ? [{ bib: p.bib, name: p.name, club: p.club }] : []);
                if (runnersList.length > 1) {
                    viewerImgBibOverlay.textContent = runnersList.map(r => `Bib #${r.bib}`).join(' & ');
                    viewerImgBibOverlay.classList.remove('hidden');
                } else if (p.bib || viewerRunnerBib) {
                    viewerImgBibOverlay.textContent = `Bib #${p.bib || viewerRunnerBib}`;
                    viewerImgBibOverlay.classList.remove('hidden');
                } else {
                    viewerImgBibOverlay.classList.add('hidden');
                }

                viewerDownloadBtn.href = largeUrl;
                viewerDownloadBtn.download = `GLCL_${p.bib ? 'Bib' + p.bib + '_' : ''}${p.id}.jpg`;

                viewerPrevBtn.disabled = viewerCurrentIndex === 0;
                viewerNextBtn.disabled = viewerCurrentIndex === viewerActivePhotos.length - 1;

                // Sync filmstrip active state & scroll active into view
                const allThumbs = viewerFilmstrip.querySelectorAll('.viewer-thumb');
                allThumbs.forEach((thumb, idx) => {
                    if (idx === viewerCurrentIndex) {
                        thumb.classList.add('border-amber-400', 'scale-105', 'opacity-100');
                        thumb.classList.remove('border-slate-800', 'opacity-40');
                        thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        thumb.classList.remove('border-amber-400', 'scale-105', 'opacity-100');
                        thumb.classList.add('border-slate-800', 'opacity-40');
                    }
                });
            };

            const openResultsViewer = (runnerName, runnerBib, runnerClub, albumId, photos, startIndex = 0) => {
                viewerActivePhotos = photos;
                viewerCurrentIndex = startIndex;
                viewerRunnerBib = runnerBib;

                viewerRunnerName.textContent = runnerName;
                viewerRunnerClub.textContent = runnerClub ? `• ${runnerClub}` : '';

                if (runnerBib) {
                    viewerBibBadge.textContent = `Bib #${runnerBib}`;
                    viewerBibBadge.classList.remove('hidden');
                } else {
                    viewerBibBadge.classList.add('hidden');
                }

                if (albumId) {
                    const albumUrl = `photos.html?album=${albumId}`;
                    viewerAlbumBtn.href = albumUrl;
                    viewerAlbumBtn.removeAttribute("target");
                    viewerAlbumBtn.removeAttribute("rel");
                    viewerAlbumBtn.classList.remove('hidden');
                    viewerMobileAlbumLink.href = albumUrl;
                    viewerMobileAlbumLink.removeAttribute("target");
                    viewerMobileAlbumLink.removeAttribute("rel");
                    viewerMobileAlbumLink.classList.remove('hidden');
                } else {
                    viewerAlbumBtn.classList.add('hidden');
                    viewerMobileAlbumLink.classList.add('hidden');
                }

                // Render filmstrip thumbnails
                if (photos.length > 1) {
                    viewerFilmstripContainer.classList.remove('hidden');
                    viewerFilmstrip.innerHTML = photos.map((p, idx) => `
                        <button type="button" 
                                class="viewer-thumb aspect-[4/3] w-14 sm:w-16 md:w-20 rounded-lg overflow-hidden border-2 transition-all shrink-0 bg-slate-900 cursor-pointer ${idx === startIndex ? 'border-amber-400 scale-105 opacity-100' : 'border-slate-800 opacity-40 hover:opacity-90'}"
                                data-index="${idx}"
                                aria-label="View photo ${idx + 1}">
                            <img src="${p.url_m}" alt="" loading="lazy" class="w-full h-full object-cover pointer-events-none">
                        </button>
                    `).join('');
                } else {
                    viewerFilmstripContainer.classList.add('hidden');
                    viewerFilmstrip.innerHTML = '';
                }

                updateResultsViewer();
                viewerModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            };

            const goToPrevPhoto = () => {
                if (viewerCurrentIndex > 0) {
                    viewerCurrentIndex--;
                    updateResultsViewer();
                }
            };

            const goToNextPhoto = () => {
                if (viewerCurrentIndex < viewerActivePhotos.length - 1) {
                    viewerCurrentIndex++;
                    updateResultsViewer();
                }
            };

            if (viewerPrevBtn) viewerPrevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                goToPrevPhoto();
            });

            if (viewerNextBtn) viewerNextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                goToNextPhoto();
            });

            if (viewerCloseBtn) viewerCloseBtn.addEventListener('click', closeResultsViewer);
            if (viewerModal) {
                viewerModal.addEventListener('click', (e) => {
                    // Clicking outside stage/controls closes
                    if (e.target === viewerModal || e.target === viewerStage) closeResultsViewer();
                });
            }

            // Mobile Touch Swipe Handling
            if (viewerStage) {
                let touchStartX = 0;
                let touchStartY = 0;
                let touchEndX = 0;
                let touchEndY = 0;

                viewerStage.addEventListener('touchstart', (e) => {
                    if (!e.touches || e.touches.length === 0) return;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                viewerStage.addEventListener('touchend', (e) => {
                    if (!e.changedTouches || e.changedTouches.length === 0) return;
                    touchEndX = e.changedTouches[0].clientX;
                    touchEndY = e.changedTouches[0].clientY;

                    const deltaX = touchEndX - touchStartX;
                    const deltaY = touchEndY - touchStartY;

                    // Swipe threshold: must be primarily horizontal and > 35px
                    if (Math.abs(deltaX) > 35 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
                        if (deltaX < 0) {
                            goToNextPhoto();
                        } else {
                            goToPrevPhoto();
                        }
                    }
                }, { passive: true });
            }

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (viewerModal && !viewerModal.classList.contains('hidden')) {
                    if (e.key === 'Escape') closeResultsViewer();
                    else if (e.key === 'ArrowLeft') goToPrevPhoto();
                    else if (e.key === 'ArrowRight') goToNextPhoto();
                }
            });

            // Delegate click on photo badges in the results table & filmstrip thumbnails
            document.addEventListener('click', (e) => {
                const badge = e.target.closest('.results-photo-badge');
                if (badge) {
                    e.preventDefault();
                    try {
                        const runner = decodeURIComponent(badge.dataset.runner || '');
                        const bib = badge.dataset.bib || '';
                        const club = decodeURIComponent(badge.dataset.club || '');
                        const album = badge.dataset.album || '';
                        const photos = JSON.parse(decodeURIComponent(badge.dataset.photos || '[]'));
                        if (photos.length > 0) {
                            openResultsViewer(runner, bib, club, album, photos, 0);
                        }
                    } catch (err) {
                        console.error('Failed to open photo viewer:', err);
                    }
                    return;
                }

                const thumb = e.target.closest('.viewer-thumb');
                if (thumb) {
                    const idx = parseInt(thumb.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < viewerActivePhotos.length) {
                        viewerCurrentIndex = idx;
                        updateResultsViewer();
                    }
                    return;
                }
            });
        });
    </script>

    <!-- UNIFIED RUNNER PHOTO LIGHTBOX & FILMSTRIP VIEWER -->
    <div id="results-photo-viewer" class="hidden fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col justify-between select-none" role="dialog" aria-modal="true" aria-label="Runner Race Photos">
        
        <!-- TOP HEADER / ACTION BAR -->
        <header class="p-3 md:p-4 border-b border-slate-900 bg-slate-950/80 flex items-center justify-between gap-2 md:gap-4 z-20 flex-shrink-0">
            <!-- Left: Runner Identity & Badges -->
            <div class="flex items-center gap-2 md:gap-3 min-w-0">
                <span class="text-[11px] md:text-xs font-mono font-bold text-amber-400 bg-amber-400/10 border border-amber-400/30 px-2 py-0.5 rounded shrink-0">
                    📸 <span class="hidden sm:inline">Race Photos</span>
                </span>
                <span id="viewer-bib-badge" class="text-[11px] md:text-xs font-mono font-bold text-sky-400 bg-sky-400/10 border border-sky-400/30 px-2 py-0.5 rounded shrink-0"></span>
                <div class="min-w-0 flex items-baseline gap-1.5 truncate">
                    <span id="viewer-runner-name" class="font-black text-white text-sm md:text-base truncate"></span>
                    <span id="viewer-runner-club" class="text-xs text-slate-400 hidden sm:inline truncate"></span>
                </div>
            </div>

            <!-- Right: Actions & Counter -->
            <div class="flex items-center gap-1.5 md:gap-2 shrink-0">
                <!-- Photo Counter Pill -->
                <span id="viewer-counter-badge" class="text-[11px] font-mono text-slate-300 bg-slate-900 px-2 md:px-2.5 py-1 rounded-lg border border-slate-800">
                    1 of 1
                </span>

                <!-- High-Res 3K Download Button -->
                <a id="viewer-download-btn" href="#" target="_blank" download class="inline-flex items-center gap-1.5 text-xs font-mono font-bold text-white bg-brand-600 hover:bg-brand-500 border border-brand-400/30 px-2.5 md:px-3 py-1.5 rounded-lg transition shadow-sm" title="Download High-Resolution Photo">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span class="hidden sm:inline">3K Download</span>
                    <span class="sm:hidden">3K</span>
                </a>

                <!-- View Full Flickr Album Link (desktop) -->
                <a id="viewer-album-btn" href="#" class="hidden md:inline-flex items-center gap-1 text-xs font-mono font-bold text-amber-300 hover:text-amber-200 bg-amber-400/10 hover:bg-amber-400/20 border border-amber-400/30 px-2.5 py-1.5 rounded-lg transition" title="Search all photos in this fixture album">
                    <span>Full Album</span>
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </a>

                <!-- Close Button -->
                <button id="viewer-close-btn" class="p-1.5 md:p-2 text-slate-400 hover:text-white bg-slate-900 hover:bg-slate-800 rounded-lg border border-slate-800 transition cursor-pointer" aria-label="Close photo viewer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </header>

        <!-- MAIN PHOTO STAGE (SWIPEABLE & FULLBLEED) -->
        <div id="viewer-stage" class="relative flex-grow flex items-center justify-center p-2 sm:p-4 md:p-6 overflow-hidden touch-pan-y">
            <!-- Left Prev Button -->
            <button id="viewer-prev-btn" class="absolute left-2 md:left-6 z-30 p-2.5 md:p-3.5 rounded-full bg-slate-900/85 hover:bg-brand-600 text-white border border-slate-700/80 backdrop-blur-sm transition-all shadow-xl disabled:opacity-20 disabled:pointer-events-none cursor-pointer" aria-label="Previous photo">
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>

            <!-- Active Main Image Wrapper -->
            <div class="relative max-h-full max-w-full flex items-center justify-center">
                <img id="viewer-main-image" src="" alt="GLCL Race Action Photo" class="max-h-[58vh] sm:max-h-[64vh] md:max-h-[70vh] max-w-full object-contain rounded-xl shadow-2xl transition duration-150 select-none">
                
                <!-- Loading Spinner -->
                <div id="viewer-image-spinner" class="hidden absolute inset-0 flex items-center justify-center bg-slate-950/40 rounded-xl backdrop-blur-sm">
                    <div class="animate-spin w-8 h-8 border-4 border-brand-500 border-t-transparent rounded-full"></div>
                </div>

                <!-- Floating Bib Badge on image -->
                <div class="absolute top-3 left-3 pointer-events-none">
                    <span id="viewer-img-bib-overlay" class="text-xs font-mono font-bold bg-slate-950/85 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-md backdrop-blur-md shadow"></span>
                </div>
            </div>

            <!-- Right Next Button -->
            <button id="viewer-next-btn" class="absolute right-2 md:right-6 z-30 p-2.5 md:p-3.5 rounded-full bg-slate-900/85 hover:bg-brand-600 text-white border border-slate-700/80 backdrop-blur-sm transition-all shadow-xl disabled:opacity-20 disabled:pointer-events-none cursor-pointer" aria-label="Next photo">
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- BOTTOM SECTION: FILMSTRIP & CONTROLS -->
        <footer class="border-t border-slate-900 bg-slate-950/90 p-2 md:p-3 flex flex-col gap-2 z-20 flex-shrink-0">
            <!-- Filmstrip Carousel -->
            <div id="viewer-filmstrip-container" class="w-full flex items-center justify-center">
                <div id="viewer-filmstrip" class="flex items-center gap-2 overflow-x-auto max-w-full py-1 px-2 scroll-smooth" style="scrollbar-width: thin; scrollbar-color: #334155 transparent;">
                    <!-- Dynamically populated thumbnails -->
                </div>
            </div>

            <!-- Mobile Action Bar / Bottom Meta -->
            <div class="flex items-center justify-between text-[11px] font-mono text-slate-500 px-2 pt-1 border-t border-slate-900/60">
                <span class="truncate">All photos © Robert Gale (Parc Bryn Bach RC) • Free personal use</span>
                <a id="viewer-mobile-album-link" href="#" class="md:hidden text-amber-400 hover:text-amber-300 font-bold shrink-0 ml-2">
                    Full Album →
                </a>
            </div>
        </footer>
    </div>

    <div id="global-footer"></div>
</body>
</html>
